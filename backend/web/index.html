<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book_Tran</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root { --bg: #f7f7f5; --panel: #ffffff; --line: #e2e2dd; --text: #1d1d1b; --muted: #77776f; --accent: #5b5bd6; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161616; --panel: #1f1f1f; --line: #333; --text: #ececec; --muted: #9a9a92; --accent: #8c8cf0; }
  }
  :root[data-theme="dark"] { --bg: #161616; --panel: #1f1f1f; --line: #333; --text: #ececec; --muted: #9a9a92; --accent: #8c8cf0; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", "Segoe UI", sans-serif; }
  aside { width: 280px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
  aside.closed { display: none; }
  aside h2 { font-size: 15px; margin: 16px; cursor: pointer; user-select: none; }
  #folderBox { padding-bottom: 6px; }
  .folderRow { display: flex; gap: 6px; padding: 0 16px 8px; }
  .folderRow input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; }
  .folderRow button { padding: 6px 10px; font-size: 13px; }
  .notice { margin-top: 10px; font-size: 12px; line-height: 1.6; color: var(--muted); cursor: default; white-space: normal; }
  .notice em { color: var(--muted); }
  .noticeHead { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; padding: 0; font: inherit; font-size: 12px; font-weight: 700; color: #b5651d; cursor: pointer; text-align: left; }
  .noticeKey { font-size: 12px; font-weight: 600; color: var(--text); margin: 4px 0 2px; }
  /* 사이드바: 목차 / 손잡이 / 파일 목록을 세로로 나눠 쓴다. 손잡이로 목차 높이를 조절하고, 서로 겹치지 않는다. */
  #folderBox { flex: none; }
  #files { flex: 1 1 0; min-height: 80px; }
  #tocBox { flex: 0 0 var(--toc-h, 40%); min-height: 60px; overflow-y: auto; border-top: 1px solid var(--line); }
  #splitter { flex: none; height: 6px; cursor: ns-resize; background: var(--line); touch-action: none; }
  #splitter:hover { background: var(--accent); }
  aside.no-files #tocBox { flex: 1 1 0; }
  #openBar { flex: none; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  #openBtn { width: 100%; padding: 9px 12px; font-weight: 600; }
  #libSection { flex: 1 1 0; min-height: 80px; display: flex; flex-direction: column; min-height: 0; position: relative; }
  #resetOpened { position: absolute; right: 14px; top: 14px; font-size: 12px; padding: 3px 9px; white-space: nowrap; }
  aside.no-files #libSection { flex: none; }
  #noticeBox { flex: none; max-height: 34%; overflow-y: auto; border-top: 1px solid var(--line); padding: 8px 12px; }
  #noticeBox .notice { font-size: 12px; }
  #tocBox .tocHead { cursor: pointer; user-select: none; }
  /* 목차를 접으면 머리글만 남고, 파일 목록이 나머지 공간을 쓴다 */
  aside.toc-collapsed #tocBox { flex: none; min-height: 0; overflow: visible; }
  aside.toc-collapsed #toc, aside.toc-collapsed #splitter { display: none; }
  aside.no-files #splitter { display: none; }
  #tocBox .tocHead { font-size: 13px; font-weight: 600; padding: 8px 16px 4px; color: var(--muted); }
  #toc { list-style: none; margin: 0; padding: 0 0 8px; }
  #toc li { font-size: 13px; padding: 4px 16px; cursor: pointer; word-break: break-all; }
  #toc li:hover { background: var(--bg); }
  pre.plain { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 15px; line-height: 1.8; margin: 0; padding: 20px 24px; color: var(--pane-fg); background: var(--pane-bg); }
  .colorBox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .colorBox input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
  #path { font-size: 12px; color: var(--muted); margin: 0 16px 8px; word-break: break-all; }
  #files { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #files li { padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; font-size: 14px; word-break: break-all; }
  #files li:hover { background: var(--bg); }
  #files li { position: relative; padding-right: 34px; }
  #files .hideBtn { position: absolute; right: 8px; top: 8px; background: none; border: none; padding: 2px 6px; color: var(--muted); font-size: 13px; }
  #files .hideBtn:hover { color: var(--text); }
  #files li.restoreRow { color: var(--accent); font-size: 13px; padding-right: 16px; }
  #files li.active { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
  #files .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); margin-left: 4px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  #title { font-weight: 600; margin-right: auto; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #status { font-size: 13px; color: var(--muted); }
  .group { display: flex; gap: 0; }
  .group button { border-radius: 0; }
  .group button:first-child { border-radius: 6px 0 0 6px; }
  .group button:last-child { border-radius: 0 6px 6px 0; }
  #panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  #panes.single { grid-template-columns: 1fr; }
  /* 원본 창과 번역 창 각각의 기본 바탕색과 글자색(사용자가 바꿀 수 있다) */
  #paneOrig { --pane-bg: #ffffff; --pane-fg: #1d1d1b; }
  #paneTrans { --pane-bg: #000000; --pane-fg: #c9c9c9; }
  .pane { position: relative; min-width: 0; min-height: 0; border-right: 1px solid var(--line); background: var(--pane-bg); color: var(--pane-fg); }
  .pane:last-child { border-right: none; }
  .pane .label { position: absolute; top: 6px; left: 10px; z-index: 2; font-size: 11px; background: var(--panel); color: var(--muted); padding: 2px 6px; border-radius: 4px; }
  .pane .content { height: 100%; overflow: auto; }
  .pane .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); padding: 24px; text-align: center; }
  .pdf-page { position: relative; margin: 12px auto; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .pdf-page canvas { display: block; }
  /* pdf.js 텍스트 레이어: 캔버스 위에 투명한 글자를 올려 드래그 선택과 복사를 가능하게 한다 */
  .textLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; line-height: 1; }
  .textLayer > span { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgba(91, 91, 214, 0.35); }
  .linkLayer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .pdfLink { position: absolute; display: block; cursor: pointer; border-radius: 2px; }
  .pdfLink:hover { background: rgba(91, 91, 214, 0.15); }
  .hidden { display: none !important; }
  select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; }
  .bpara { margin: 0 0 0.8em; line-height: 1.6; color: var(--pane-fg); }
  .bpage { margin: 12px auto; padding: 18px 22px; background: var(--pane-bg); color: var(--pane-fg); border: 1px solid var(--line); border-radius: 6px; overflow-y: auto; font-size: 15px; }
  .bpage .pno { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  /* 번역 중인 문단도 글자색은 그대로 두고, 왼쪽 선으로만 표시한다(흐린 회색으로 보이지 않게) */
  .bpara.pending { border-left: 3px solid var(--accent); padding-left: 8px; }
</style>
</head>
<body>
<aside>
  <!-- 위에서 아래 순서: 파일 열기(고정) → 목차 → 열었던 파일 목록 → 이용 안내(고정) -->
  <div id="openBar">
    <button id="openBtn" type="button">📂 파일 열기</button>
    <input type="file" id="pickFile" hidden accept=".epub,.pdf,.txt,application/epub+zip,application/pdf,text/plain">
  </div>
  <div id="tocBox" class="hidden">
    <div class="tocHead" id="tocToggle" role="button" tabindex="0" title="목차 접기/펴기">▾ 목차</div>
    <ul id="toc"></ul>
  </div>
  <div id="splitter" class="hidden" title="드래그해서 목차와 파일 목록의 크기 조절"></div>
  <div id="libSection">
    <h2 id="libToggle" role="button" tabindex="0" title="파일 목록 접기/펴기">▾ 라이브러리</h2>
    <button id="resetOpened" type="button" title="저장해 둔 책별 읽던 위치를 모두 지우고, 다음에 여는 책은 맨 위에서 시작합니다">목차 이동 초기화</button>
    <div id="folderBox">
      <div id="path"></div>
      <div class="folderRow">
        <input id="folderInput" placeholder="예: D:\books 또는 \\NAS\books">
        <button id="folderBtn">폴더 변경</button>
      </div>
    </div>
    <ul id="files"></ul>
  </div>
  <div id="noticeBox"></div>
</aside>
<main>
  <header>
    <button id="sideBtn" title="라이브러리 패널 접기/펴기">☰</button>
    <span id="title">파일을 선택하세요</span>
    <button id="translateBtn" class="primary hidden">번역 시작</button>
    <button id="browserBtn" class="hidden" title="API 키 없이 브라우저 내장 번역(Chrome 138 이상)을 사용합니다">번역</button>
    <select id="srcLang" class="hidden" title="원문 언어">
      <option value="en">원문: 영어</option>
      <option value="ja">원문: 일본어</option>
      <option value="zh">원문: 중국어</option>
      <option value="fr">원문: 프랑스어</option>
      <option value="de">원문: 독일어</option>
      <option value="es">원문: 스페인어</option>
    </select>
    <select id="tgtLang" class="hidden" title="번역 도착 언어">
      <option value="ko">번역: 한국어</option>
      <option value="en">번역: 영어</option>
      <option value="ja">번역: 일본어</option>
      <option value="zh">번역: 중국어</option>
      <option value="fr">번역: 프랑스어</option>
      <option value="de">번역: 독일어</option>
      <option value="es">번역: 스페인어</option>
    </select>
    <span class="colorBox" title="보기 화면의 글자색과 바탕색">
      <label>원본 글자 <input type="color" id="origFg" value="#1d1d1b"></label>
      <label>바탕 <input type="color" id="origBg" value="#ffffff"></label>
      <label>번역 글자 <input type="color" id="transFg" value="#c9c9c9"></label>
      <label>바탕 <input type="color" id="transBg" value="#000000"></label>
      <button id="colorReset" type="button">기본</button>
    </span>
    <span id="status"></span>
    <div class="group hidden" id="modes">
      <button data-mode="original">원본</button>
      <button data-mode="translated">번역</button>
      <button data-mode="side">나란히</button>
    </div>
    <div class="group hidden" id="nav">
      <button id="prev">이전 장</button>
      <button id="next">다음 장</button>
    </div>
    <span id="chapter" class="hidden"></span>
  </header>
  <section id="panes">
    <div class="pane" id="paneOrig"><span class="label">원본</span><div class="content"></div></div>
    <div class="pane" id="paneTrans"><span class="label">번역</span><div class="content"></div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const state = {
  serverMode: true,    // 로컬 백엔드가 있으면 true, 없으면 브라우저에서 고른 파일만 연다
  item: null,          // 선택한 파일 {name, format, doc_id, translated, local?}
  mode: 'side',
  chapter: 0,
  views: {},           // 'orig' | 'trans' -> {kind: 'epub'|'pdf', ...}
  pollTimer: null,
  syncing: false,
};

async function api(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}

function setStatus(text) { $('status').textContent = text || ''; }

// 목록에서 제외한 항목. 파일은 지우지 않고, 이 브라우저의 목록에서만 숨긴다.
function readHidden() {
  try { return JSON.parse(localStorage.getItem('hiddenFiles') || '[]'); } catch (_) { return []; }
}
function writeHidden(list) {
  try { localStorage.setItem('hiddenFiles', JSON.stringify(list)); } catch (_) {}
}
function hideKey(item) { return `${item.name}|${item.size}`; }
function hideItem(item) {
  const list = readHidden();
  if (!list.includes(hideKey(item))) list.push(hideKey(item));
  writeHidden(list);
  loadFiles();
}

async function loadFiles() {
  try {
    const folder = await api('/local/folder');
    $('path').textContent = `폴더: ${folder.path}`;
    $('folderInput').placeholder = folder.path;
    $('libToggle').textContent = '▾ 라이브러리';
    const list = await api('/local/files');
    const ul = $('files');
    ul.innerHTML = '';
    if (list.length === 0) setStatus('EPUB/PDF 파일이 없습니다.');
    const hidden = readHidden();
    const visible = list.filter((i) => !hidden.includes(hideKey(i)));
    const hiddenCount = list.length - visible.length;
    for (const item of visible) {
      const li = document.createElement('li');
      li.dataset.name = item.name;
      const name = document.createElement('div');
      name.textContent = item.name;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${item.format.toUpperCase()} · ${(item.size / 1024 / 1024).toFixed(1)} MB`;
      if (item.translated) {
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = '번역됨';
        meta.appendChild(b);
      }
      li.append(name, meta);
      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'hideBtn';
      x.textContent = '✕';
      x.title = '목록에서 제외합니다(파일은 지우지 않습니다)';
      x.onclick = (e) => { e.stopPropagation(); hideItem(item); };
      li.appendChild(x);
      li.onclick = () => selectFile(item, li);
      ul.appendChild(li);
    }
    if (hiddenCount > 0) {
      const row = document.createElement('li');
      row.className = 'restoreRow';
      row.textContent = `제외한 항목 ${hiddenCount}개 다시 보기`;
      row.onclick = () => { writeHidden([]); loadFiles(); };
      ul.appendChild(row);
    }
  } catch (e) {
    enterPickerMode();
  }
}

// 서버(로컬 백엔드)가 없으면 브라우저에서 파일을 직접 고르는 모드로 바꾼다.
// 이때 파일은 서버로 올라가지 않고 이 브라우저 안에서만 열린다.
function enterPickerMode() {
  state.serverMode = false;
  $('folderBox').classList.add('hidden');
  $('path').textContent = '';
  $('files').innerHTML = '';
  $('libToggle').textContent = '▾ 열었던 파일';
  setStatus('');
}

// 파일 열기 버튼(상단 고정)과 파일 선택칸을 연결한다. 고른 파일은 목록 맨 위에 추가된다.
function setupPicker() {
  const ul = $('files');
  const input = $('pickFile');
  $('openBtn').onclick = () => input.click();
  // 목차 이동 초기화: 책별로 저장해 둔 읽던 위치를 모두 지운다(파일 목록은 그대로)
  $('resetOpened').onclick = () => {
    try { localStorage.removeItem(POS_KEY); } catch (_) {}
    setStatus('읽던 위치를 초기화했습니다.');
  };
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const lower = file.name.toLowerCase();
    const format = lower.endsWith('.epub') ? 'epub' : lower.endsWith('.pdf') ? 'pdf' : lower.endsWith('.txt') ? 'txt' : null;
    if (!format) { setStatus('EPUB, PDF, TXT 파일만 열 수 있습니다.'); return; }
    const item = {
      name: file.name,
      format,
      size: file.size,
      local: file,
      translated: false,
    };
    const row = document.createElement('li');
    const name = document.createElement('div');
    name.textContent = file.name;
    row.append(name);
    // ✕: 이 목록에서 뺀다. 파일은 브라우저가 기억하지 않으므로 다시 열려면 파일 열기로 골라야 한다.
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'hideBtn';
    x.textContent = '✕';
    x.title = '목록에서 제외합니다';
    x.onclick = (e) => { e.stopPropagation(); row.remove(); };
    row.appendChild(x);
    row.onclick = () => selectFile(item, row);
    ul.prepend(row);
    selectFile(item, row);
  };
}

// 이용 안내: 사이드바 맨 아래에 항상 보인다. 브라우저 언어에 맞는 문구를 보여 준다(ko, en, ja, zh, fr, de, es).
function renderNotice() {
  const notice = document.createElement('div');
  notice.className = 'notice';
  const koHtml = `
    <strong>이용 안내</strong><br>
    이 도구는 이용자가 <b>본인이 적법하게 소유하거나 이용할 권한이 있는</b> EPUB·PDF 파일을 번역해 보기 위한 보조 도구입니다.
    업로드하거나 번역하는 자료에 대한 저작권과 이용 권한은 이용자 본인에게 있으며, 권한 없는 자료를 사용하지 마십시오.
    파일 선택 모드에서는 파일이 서버로 전송되지 않고 이 브라우저 안에서만 처리됩니다.
    서비스 운영자는 이용자가 업로드한 자료와 번역 결과의 적법성을 보증하지 않으며, 이용자의 권한 없는 이용으로 발생한 저작권 침해 등 분쟁에 대해 책임을 지지 않습니다.
    번역 결과는 개인 학습·참고 목적으로만 쓰고 재배포하지 마십시오.
    `;
  const enHtml = `
    <strong>Terms of use</strong><br>
    This tool helps you translate EPUB and PDF files that <b>you lawfully own or are otherwise authorized to use</b>.
    You are responsible for your own rights and permissions for any file you upload or translate. Do not use files you are not authorized to use.
    In file-picker mode, files are not sent to a server; they are processed only inside your browser.
    The operator does not warrant the lawfulness of uploaded material or translated output and is not responsible for copyright infringement or other disputes arising from unauthorized use by you.
    Use translated output only for personal study or reference. Do not redistribute it.
    `;

function clearViews() {
  for (const key of Object.keys(state.views)) dropView(key);
  state.views = {};
  document.querySelectorAll('#panes .content').forEach((el) => { el.innerHTML = ''; el.onscroll = null; });
}

function dropView(key) {
  const v = state.views[key];
  if (!v) return;
  try { if (v.rendition) v.rendition.destroy(); } catch (_) {}
  try { if (v.book) v.book.destroy(); } catch (_) {}
  try { if (v.pdf) v.pdf.destroy(); } catch (_) {}
  if (v.observer) v.observer.disconnect();
  if (v.content) v.content.onscroll = null;
  delete state.views[key];
}

function isEpub() { return state.item && state.item.format === 'epub'; }

async function selectFile(item, li) {
  document.querySelectorAll('#files li').forEach((el) => el.classList.remove('active'));
  li.classList.add('active');
  stopPolling();
  savePos(); // 바꾸기 전에 지금 책의 위치를 저장한다
  clearViews();
  state.item = item;
  state.chapter = 0;
  $('title').textContent = item.name;
  setStatus('');

  state.transMode = 'server';

  $('translateBtn').classList.toggle('hidden', !state.serverMode || !!item.local || item.format === 'txt');
  $('translateBtn').disabled = false;
  $('browserBtn').classList.remove('hidden');
  $('browserBtn').disabled = false;
  $('srcLang').classList.remove('hidden');
  $('tgtLang').classList.remove('hidden');
  $('modes').classList.remove('hidden');
  // 장 이동은 EPUB 전용. PDF는 스크롤로 넘긴다.
  $('nav').classList.toggle('hidden', !isEpub());
  $('chapter').classList.toggle('hidden', !isEpub());

  await openOriginal();
  buildToc();
  if (item.translated) await openTranslated();
  else showMessage('paneTrans', '아직 번역되지 않았습니다.');

function showMessage(paneId, text) {

// ---------------- EPUB (epub.js)

async function openEpub(key, src, paneId) {
  const content = $(paneId).querySelector('.content');
  content.innerHTML = '';
  const book = ePub(typeof src === 'string' ? src : src.slice(0));
  const rendition = book.renderTo(content, { width: '100%', height: '100%', flow: 'scrolled-doc' });
  applyEpubColors(key, rendition);
  // 책 본문(iframe) 안에서 누른 방향키도 장 이동에 쓴다
  rendition.hooks.content.register((contents) => {
    contents.document.addEventListener('keydown', epubArrowKey);
  });

  state.views[key] = { kind: 'epub', book, rendition, count: book.spine.length, content };
}

// ---------------- PDF (pdf.js)

async function openPdf(key, src, paneId) {
  const content = $(paneId).querySelector('.content');
  content.innerHTML = '';
  const doc = await pdfjsLib.getDocument(typeof src === 'string' ? src : { data: src.slice(0) }).promise;
  const view = { kind: 'pdf', pdf: doc, content, count: doc.numPages, pages: [] };
  state.views[key] = view;

  const width = Math.max(320, content.clientWidth - 32);
  const first = await doc.getPage(1);
  const base = first.getViewport({ scale: 1 });
  const scale = width / base.width;

  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const p = view.pages[Number(e.target.dataset.index)];
      if (p && !p.rendered) { p.rendered = true; renderPdfPage(view, p, scale); }
    }
  }, { root: content, rootMargin: '600px 0px' });

  for (let i = 0; i < doc.numPages; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'pdf-page';
    wrap.dataset.index = String(i);
    wrap.style.width = `${base.width * scale}px`;
    wrap.style.height = `${base.height * scale}px`;
    content.appendChild(wrap);
    view.pages.push({ num: i + 1, wrap, rendered: false });
    io.observe(wrap);
  }
  view.observer = io;
}

async function renderPdfPage(view, p, scale) {
  const doc = view.pdf;
  const page = await doc.getPage(p.num);
  const vp = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(vp.width);
  canvas.height = Math.floor(vp.height);
  p.wrap.style.width = `${vp.width}px`;
  p.wrap.style.height = `${vp.height}px`;
  p.wrap.innerHTML = '';
  p.wrap.appendChild(canvas);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

  // 글자 선택용 텍스트 레이어
  const textDiv = document.createElement('div');
  textDiv.className = 'textLayer';
  textDiv.style.width = `${vp.width}px`;
  textDiv.style.height = `${vp.height}px`;
  p.wrap.appendChild(textDiv);
  const textContent = await page.getTextContent();
  await pdfjsLib.renderTextLayer({ textContentSource: textContent, container: textDiv, viewport: vp, textDivs: [] }).promise;

  // 링크 레이어: 목차처럼 쪽 이동 링크와 바깥 주소 링크를 누를 수 있게 한다
  const annotations = await page.getAnnotations();
  const linkDiv = document.createElement('div');
  linkDiv.className = 'linkLayer';
  for (const a of annotations) {
    if (a.subtype !== 'Link' || !a.rect) continue;
    const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
    const el = document.createElement('a');
    el.className = 'pdfLink';
    el.style.left = `${Math.min(x1, x2)}px`;
    el.style.top = `${Math.min(y1, y2)}px`;
    el.style.width = `${Math.abs(x2 - x1)}px`;
    el.style.height = `${Math.abs(y2 - y1)}px`;
    if (a.dest) {
      el.href = '#';
      el.title = '해당 쪽으로 이동';
      el.onclick = (e) => { e.preventDefault(); goToPdfDest(view, a.dest); };
    } else if (a.url && /^(https?:|mailto:)/i.test(a.url)) {
      el.href = a.url;
      el.target = '_blank';
      el.rel = 'noopener noreferrer';
      el.title = a.url;
    } else {
      continue; // 지원하지 않는 링크(실행 파일 등)는 만들지 않는다
    }
    linkDiv.appendChild(el);
  }
  p.wrap.appendChild(linkDiv);
}

// 쪽 이동 링크: 목적지(이름 또는 배열)를 쪽 번호로 바꿔 그 쪽으로 스크롤한다
async function goToPdfDest(view, dest) {
  try {
    const explicit = typeof dest === 'string' ? await view.pdf.getDestination(dest) : dest;
    if (!explicit || !explicit[0]) return;
    const index = await view.pdf.getPageIndex(explicit[0]);
    const target = view.pages[index];
    if (target) {
      // 원본 창(.content) 안에서 그 쪽이 맨 위에 오도록 스크롤을 바로 옮긴다
      const box = target.wrap.parentElement.getBoundingClientRect();
      const page = target.wrap.getBoundingClientRect();
      target.wrap.parentElement.scrollTop += page.top - box.top - 12;
    }
  } catch (e) {
    setStatus(`링크를 열 수 없습니다: ${e.message}`);
  }
}

// ---------------- 텍스트 파일 (TXT)

async function textOf(src) {
  if (typeof src === 'string') return (await fetch(src)).text();
  return new TextDecoder('utf-8').decode(src);
}

async function openText(key, src, paneId) {

  content.innerHTML = '';
  const pre = document.createElement('pre');

// ---------------- 목차 (사이드바)

function joinPath(dir, rel) {
  const out = [];
  for (const part of (dir + rel).split('/')) {
    if (part === '..') out.pop();
    else if (part && part !== '.') out.push(part);
  }
  return out.join('/');
}

// 목차 항목 목록을 사이드바에 그린다. items: {title, depth, pick()}
function renderToc(items) {
  const ul = $('toc');
  ul.innerHTML = '';
  if (!items || items.length === 0) {
    $('tocBox').classList.add('hidden');
    $('splitter').classList.add('hidden');
    return;
  }
  for (const it of items) {
    const li = document.createElement('li');
    li.textContent = it.title || '(제목 없음)';
    li.style.paddingLeft = `${16 + it.depth * 14}px`;
    li.title = li.textContent;
    li.onclick = () => it.pick();
    ul.appendChild(li);
  }
  $('tocBox').classList.remove('hidden');
  $('splitter').classList.remove('hidden');
}

function buildToc() {
  renderToc([]);
  if (!state.item || state.item.format === 'txt') return;
  if (isEpub()) {
    loadEpubToc(state.item.local ? state.item.bytes || null : `/local/file?name=${encodeURIComponent(state.item.name)}`)
      .then((entries) => renderToc(entries.map((e) => ({
        title: e.title,
        depth: e.depth,
        pick: () => { if (e.index >= 0) showChapter(e.index); },
      }))))
      .catch(() => renderToc([]));
    return;
  }
  const view = state.views.orig;
  if (!view || !view.pdf) return;
  view.pdf.getOutline().then(async (outline) => {
    // 북마크가 없으면 본문 앞의 인쇄된 목차(Contents)를 읽어 만든다
    if (!outline || outline.length === 0) return renderToc(await buildPrintedToc(view));
    const flat = [];
    const walk = (list, depth) => {
      for (const node of list) {
        flat.push({ title: node.title, depth, pick: () => goToPdfDest(view, node.dest) });
        if (node.items && node.items.length) walk(node.items, depth + 1);
      }
    };
    walk(outline, 0);
    renderToc(flat);
  }).catch(() => renderToc([]));
}

// 쪽 번호로 바로 이동(목차 항목용). 원본 창 안에서 그 쪽이 맨 위에 오게 한다.
function scrollToPdfPage(view, index) {
  const target = view.pages[index];
  if (!target) return;
  const c = target.wrap.parentElement;
  const box = c.getBoundingClientRect();
  c.scrollTop += target.wrap.getBoundingClientRect().top - box.top - 12;
}

// 북마크가 없는 PDF용 목차: 앞쪽의 'Contents' 쪽을 읽고, 각 제목을 본문에서 같은 순서로 찾는다.
// 찾지 못한 제목은 뺀다. 쪽 번호가 적힌 목차 줄은 번호를 떼고 제목만 쓴다.
async function buildPrintedToc(view) {
  const pdf = view.pdf;
  const cache = new Map();
  const linesOf = async (i) => {
    if (!cache.has(i)) {
      const tc = await (await pdf.getPage(i + 1)).getTextContent();
      const text = tc.items.map((it) => it.str + (it.hasEOL ? '\n' : '')).join('');
      cache.set(i, text.split('\n').map((s) => s.replace(/\s+/g, ' ').trim()).filter(Boolean));
    }
    return cache.get(i);
  };
  const isHead = (l) => /^(contents|table of contents|목차)$/i.test(l);
  const norm = (s) => s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();

  // 1) 목차 쪽: 앞 20쪽 안에서 'Contents' 머리글이 있는 쪽
  let tocPage = -1;
  for (let i = 0; i < Math.min(20, pdf.numPages); i++) {
    if ((await linesOf(i)).some(isHead)) { tocPage = i; break; }
  }
  if (tocPage < 0) return [];

  // 2) 목차 줄 모으기: 머리글 다음 줄부터, 점선과 쪽 번호는 뗀다
  const titles = [];
  let started = false;
  for (const line of await linesOf(tocPage)) {
    if (!started) { started = isHead(line); continue; }
    const title = line.replace(/\s*\.{2,}\s*\d*\s*$/, '').trim();
    if (title && /\p{L}/u.test(title)) titles.push(title);
  }

  // 3) 본문에서 순서대로 찾기(앞에서 찾은 쪽 뒤에서만 찾는다)
  const result = [];
  let cursor = tocPage + 1;
  for (const title of titles) {
    const want = norm(title);
    if (!want) continue;
    for (let i = cursor; i < pdf.numPages && i <= cursor + 60; i++) {
      if ((await linesOf(i)).some((l) => norm(l) === want)) {
        const m = title.match(/^(\d+(?:\.\d+)*)/);
        const depth = m ? m[1].split('.').length - 1 : 0;
        result.push({ title, depth, pick: () => scrollToPdfPage(view, i) });
        cursor = i;
        break;
      }
    }
  }
  return result;
}

// EPUB 목차: nav 문서(EPUB3)를 우선 읽고, 없으면 toc.ncx(EPUB2)를 읽는다.
async function loadEpubToc(src) {
  if (!src) return [];
  const buf = typeof src === 'string' ? await (await fetch(src)).arrayBuffer() : src.slice(0);
  const zip = await JSZip.loadAsync(buf);
  const parse = (xml, type) => new DOMParser().parseFromString(xml, type);
  const container = parse(await zip.file('META-INF/container.xml').async('string'), 'application/xml');
  const opfPath = container.getElementsByTagName('rootfile')[0].getAttribute('full-path');
  const opf = parse(await zip.file(opfPath).async('string'), 'application/xml');
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';

  const manifest = {};
  let navHref = null;
  let ncxHref = null;
  for (const item of opf.getElementsByTagName('item')) {
    const id = item.getAttribute('id');
    const href = decodeURIComponent(item.getAttribute('href'));
    manifest[id] = href;
    if ((item.getAttribute('properties') || '').split(/\s+/).includes('nav')) navHref = href;
    if (item.getAttribute('media-type') === 'application/x-dtbncx+xml') ncxHref = href;
  }
  // 장 순서(spine)를 전체 경로 목록으로 만든다
  const spine = [];
  for (const ref of opf.getElementsByTagName('itemref')) {
    const href = manifest[ref.getAttribute('idref')];
    if (href) spine.push(joinPath(base, href));
  }

  const entries = [];
  const indexOf = (docPath, rel) => {
    const target = joinPath(docPath.slice(0, docPath.lastIndexOf('/') + 1), decodeURIComponent(rel.split('#')[0]));
    return spine.indexOf(target);
  };

  if (navHref) {
    const navPath = joinPath(base, navHref);
    const doc = parse(await zip.file(navPath).async('string'), 'text/html');
    const nav = [...doc.querySelectorAll('nav')].find((n) => /toc/.test(n.getAttribute('epub:type') || n.getAttribute('type') || '')) || doc.querySelector('nav');
    if (nav) {
      for (const a of nav.querySelectorAll('a[href]')) {
        entries.push({ title: a.textContent.trim(), depth: countOl(a), index: indexOf(navPath, a.getAttribute('href')) });
      }
    }
  } else if (ncxHref) {
    const ncxPath = joinPath(base, ncxHref);
    const ncx = parse(await zip.file(ncxPath).async('string'), 'application/xml');
    for (const point of ncx.getElementsByTagName('navPoint')) {
      const label = point.getElementsByTagName('text')[0];
      const content = point.getElementsByTagName('content')[0];
      if (!label || !content) continue;
      entries.push({ title: label.textContent.trim(), depth: countNavPoint(point), index: indexOf(ncxPath, content.getAttribute('src')) });
    }
  }
  return entries;
}

// nav 안에서 이 링크가 몇 겹 중첩됐는지(목차 들여쓰기 단계)
function countOl(a) {
  let depth = -1;
  for (let el = a; el; el = el.parentElement) if (el.tagName === 'OL') depth++;
  return Math.max(0, depth);
}

function countNavPoint(point) {
  let depth = 0;
  for (let el = point.parentElement; el; el = el.parentElement) if (el.tagName === 'navPoint') depth++;
  return depth;
}

// ---------------- 공통 열기

// 서버 파일이면 URL, 브라우저에서 고른 파일이면 ArrayBuffer를 돌려준다.
async function srcOf(item) {
  if (item.local) {
    if (!item.bytes) item.bytes = await item.local.arrayBuffer();
    return item.bytes;
  }
  return `/local/file?name=${encodeURIComponent(item.name)}`;
}

async function openOriginal() {
  try {
    const src = await srcOf(state.item);
    if (isEpub()) await openEpub('orig', src, 'paneOrig');
    else if (state.item.format === 'txt') await openText('orig', src, 'paneOrig');
    else await openPdf('orig', src, 'paneOrig');
  } catch (e) {
    showMessage('paneOrig', `원본을 열 수 없습니다: ${e.message}`);
  }
}

async function openTranslated() {
  try {
    const url = `/documents/${state.item.doc_id}/translated?lang=${$('tgtLang').value}`;
    if (isEpub()) await openEpub('trans', url, 'paneTrans');
    else await openPdf('trans', url, 'paneTrans');
  } catch (e) {
    showMessage('paneTrans', `번역본을 열 수 없습니다: ${e.message}`);
  }
}

// ---------------- 보기 색 (글자색, 바탕색)
//
// 사용자가 고른 색은 브라우저에 저장된다. EPUB 본문은 책 자체의 CSS가 색을 정하므로,
// epub.js의 테마 재정의로 글자색과 바탕색을 덮어쓴다.

// 원본(orig)과 번역(trans)을 따로 설정한다. 번역 쪽 기본값은 검은 바탕에 밝은 회색 글자(201, 201, 201).
const PANE_DEFAULTS = {
  orig: { fg: '#1d1d1b', bg: '#ffffff' },
  trans: { fg: '#c9c9c9', bg: '#000000' },
};

function applyEpubColors(key, rendition) {
  const c = state.colors[key];
  try {
    rendition.themes.override('color', c.fg);
    rendition.themes.override('background', c.bg);
  } catch (_) {}
}

function applyPaneColors(key, fg, bg, save = true) {
  state.colors[key] = { fg, bg };
  const pane = $(key === 'orig' ? 'paneOrig' : 'paneTrans');
  pane.style.setProperty('--pane-fg', fg);
  pane.style.setProperty('--pane-bg', bg);
  $(`${key}Fg`).value = fg;
  $(`${key}Bg`).value = bg;
  for (const [name, v] of Object.entries(state.views)) {
    if (v.kind === 'epub' && v.rendition) applyEpubColors(name, v.rendition);
  }
  if (save) {
    try { localStorage.setItem('paneColors2', JSON.stringify(state.colors)); } catch (_) {}
  }
}

state.colors = { orig: { ...PANE_DEFAULTS.orig }, trans: { ...PANE_DEFAULTS.trans } };
try {
  const saved = JSON.parse(localStorage.getItem('paneColors2') || 'null');
  for (const key of ['orig', 'trans']) {
    if (saved && saved[key] && saved[key].fg && saved[key].bg) state.colors[key] = saved[key];
  }
} catch (_) {}
for (const key of ['orig', 'trans']) {
  applyPaneColors(key, state.colors[key].fg, state.colors[key].bg, false);
  $(`${key}Fg`).oninput = (e) => applyPaneColors(key, e.target.value, state.colors[key].bg);
  $(`${key}Bg`).oninput = (e) => applyPaneColors(key, state.colors[key].fg, e.target.value);
}
$('colorReset').onclick = () => {
  for (const key of ['orig', 'trans']) applyPaneColors(key, PANE_DEFAULTS[key].fg, PANE_DEFAULTS[key].bg);
};

// ---------------- 읽던 위치 기억 (책마다 따로 저장, 브라우저에 보관)
// 저장하는 것: EPUB은 장 번호, 모든 형식은 원본 창의 스크롤 비율.

const POS_KEY = 'readPos';

function readPositions() {
  try { return JSON.parse(localStorage.getItem(POS_KEY) || '{}'); } catch (_) { return {}; }
}

function posKey(item) {
  return `${item.format}|${item.name}|${item.size}`;
}

function origContent() {
  return $('paneOrig').querySelector('.content');
}

function savePos() {
  const item = state.item;
  const c = item && origContent();
  if (!c) return;
  const range = c.scrollHeight - c.clientHeight;
  const all = readPositions();
  all[posKey(item)] = {
    chapter: item.format === 'epub' ? state.chapter : 0,
    ratio: range > 0 ? c.scrollTop / range : 0,
    t: Date.now(),
  };
  try { localStorage.setItem(POS_KEY, JSON.stringify(all)); } catch (_) {}
}

function restorePos(item) {
  const pos = readPositions()[posKey(item)];
  if (!pos) { resetPaneScroll(); return; }
  if (item.format === 'epub') {
    state.chapter = pos.chapter || 0;
    showChapter(state.chapter);
  }
  // 레이아웃이 잡힌 뒤에 스크롤 위치를 맞춘다
  setTimeout(() => {
    const c = origContent();
    const range = c.scrollHeight - c.clientHeight;
    c.scrollTop = range > 0 ? pos.ratio * range : 0;
  }, 400);
}

function attachPosSave() {
  let timer = null;
  origContent().addEventListener('scroll', () => {
    clearTimeout(timer);
    timer = setTimeout(savePos, 500);
  }, { passive: true });
  window.addEventListener('pagehide', savePos);
}
attachPosSave();

// 파일을 열면 두 창 모두 맨 위에서 시작한다(이전 파일의 스크롤 위치를 이어받지 않게)
function resetPaneScroll() {
  state.syncing = true;
  document.querySelectorAll('#panes .content').forEach((c) => { c.scrollTop = 0; });
  requestAnimationFrame(() => { state.syncing = false; });
}

// ---------------- 방향키 장 이동 (EPUB)
// ← / → 로 이전·다음 장으로 넘어간다. 입력칸에 커서가 있을 때는 무시한다.

function epubArrowKey(e) {
  if (!isEpub() || !state.views.orig) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); showChapter(state.chapter + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); showChapter(state.chapter - 1); }
}

document.addEventListener('keydown', (e) => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  epubArrowKey(e);
});

// ---------------- 장 이동 (EPUB)

function showChapter(index) {
  const views = Object.values(state.views).filter((v) => v.kind === 'epub');
  const browser = state.transMode === 'browser' && state.views.trans && state.views.trans.kind === 'browser'
    ? state.views.trans : null;
  if (views.length === 0 && !browser) return;
  const total = Math.max(0, ...views.map((v) => v.count), browser ? browser.count : 0);
  if (total === 0) return;
  state.chapter = Math.min(Math.max(index, 0), total - 1);
  for (const v of views) {
    const i = Math.min(state.chapter, v.count - 1);
    v.rendition.display(v.book.spine.get(i).href);
  }
  $('chapter').textContent = `${state.chapter + 1} / ${total}장`;
  if (browser) showBrowserChapter(state.chapter);
}

// ---------------- 브라우저 내장 번역 (API 키 불필요)
//
// Chrome 138 이상의 Translator API를 쓴다. 번역 모델은 브라우저가 기기 안에서 실행하며,
// 번역 결과는 파일로 저장하지 않고 화면에만 보여 준다.

state.transMode = 'server';   // 'server' | 'browser'
state.browser = { translator: null, lang: null, cache: new Map(), epub: null, token: 0 };

async function getTranslator(sourceLanguage, targetLanguage) {
  if (typeof window.Translator === 'undefined') {
    throw new Error('이 브라우저에는 내장 번역 API가 없습니다. Chrome 138 이상에서 열어 주세요.');
  }
  if (sourceLanguage === targetLanguage) {
    throw new Error('원문 언어와 번역 언어가 같습니다. 번역 언어를 바꿔 주세요.');
  }
  const opts = { sourceLanguage, targetLanguage };
  const availability = await Translator.availability(opts);
  if (availability === 'unavailable') {
    throw new Error(`${sourceLanguage} → ${targetLanguage} 번역을 이 브라우저에서 쓸 수 없습니다.`);
  }
  const pair = `${sourceLanguage}>${targetLanguage}`;
  if (state.browser.translator && state.browser.lang === pair) return state.browser.translator;
  setStatus(availability === 'available' ? '번역기 준비 중...' : '번역 모델 내려받는 중...');
  const translator = await Translator.create({
    ...opts,
    monitor(m) {
      m.addEventListener('downloadprogress', (e) => setStatus(`번역 모델 내려받는 중 ${Math.round(e.loaded * 100)}%`));
    },
  });
  state.browser.translator = translator;
  state.browser.lang = pair;
  return translator;
}

// 긴 문단은 Translator 입력 한도를 넘지 않도록 문장 경계에서 나눈다.
function chunkText(text, max = 1000) {
  const parts = [];
  let rest = text;
  while (rest.length > max) {
    let cut = rest.lastIndexOf('. ', max);
    if (cut < max * 0.5) cut = rest.lastIndexOf(' ', max);
    if (cut <= 0) cut = max - 1;
    parts.push(rest.slice(0, cut + 1));
    rest = rest.slice(cut + 1).trimStart();
  }
  if (rest) parts.push(rest);
  return parts;
}

async function translateText(text) {
  const out = [];
  for (const part of chunkText(text)) {
    const key = `${state.browser.lang}|${part}`;
    if (!state.browser.cache.has(key)) {
      state.browser.cache.set(key, await state.browser.translator.translate(part));
    }
    out.push(state.browser.cache.get(key));
  }
  return out.join(' ');
}

const hasLetter = (s) => /\p{L}/u.test(s);

// EPUB: zip을 직접 읽어 spine 순서대로 장(XHTML) 목록을 만든다.
async function loadEpubChapters(src) {
  const buf = typeof src === 'string' ? await (await fetch(src)).arrayBuffer() : src.slice(0);
  const zip = await JSZip.loadAsync(buf);
  const parse = (xml, type) => new DOMParser().parseFromString(xml, type);
  const container = parse(await zip.file('META-INF/container.xml').async('string'), 'application/xml');
  const opfPath = container.getElementsByTagName('rootfile')[0].getAttribute('full-path');
  const opf = parse(await zip.file(opfPath).async('string'), 'application/xml');
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const manifest = {};
  for (const item of opf.getElementsByTagName('item')) manifest[item.getAttribute('id')] = item.getAttribute('href');
  const chapters = [];
  for (const ref of opf.getElementsByTagName('itemref')) {
    const href = manifest[ref.getAttribute('idref')];
    if (!href) continue;
    const file = zip.file(decodeURIComponent(base + href));
    if (!file) continue;
    const xml = await file.async('string');
    let doc = parse(xml, 'application/xhtml+xml');
    if (doc.querySelector('parsererror')) doc = parse(xml, 'text/html');
    chapters.push(doc);
  }
  return chapters;
}

const EPUB_BLOCKS = 'p, h1, h2, h3, h4, h5, h6, li, blockquote, figcaption, dt, dd';

function epubParagraphs(doc) {
  if (!doc.body) return [];
  const out = [];
  doc.body.querySelectorAll(EPUB_BLOCKS).forEach((el) => {
    if (el.querySelector(EPUB_BLOCKS)) return; // 안쪽 블록이 있으면 안쪽을 쓴다
    const text = el.textContent.replace(/\s+/g, ' ').trim();
    if (hasLetter(text)) out.push(text);
  });
  return out;
}

// PDF: 텍스트 조각을 줄 단위로 모으고, 줄 간격이 벌어지면 문단을 나눈다.
async function pdfPageParagraphs(page) {
  const content = await page.getTextContent();
  const lines = [];
  let cur = null;
  const flush = () => { if (cur && cur.text.trim()) lines.push(cur); cur = null; };
  for (const item of content.items) {
    const y = item.transform[5];
    const h = Math.abs(item.transform[3]) || item.height || 10;
    if (!cur || Math.abs(cur.y - y) > h * 0.5) { flush(); cur = { y, h, text: '' }; }
    cur.text += item.str;
    if (item.hasEOL) flush();
  }
  flush();

  const paras = [];
  let prev = null;
  let buf = '';
  for (const line of lines) {
    const t = line.text.replace(/\s+/g, ' ').trim();
    if (!t) continue;
    if (!prev || Math.abs(prev.y - line.y) > prev.h * 1.8) {
      if (buf) paras.push(buf);
      buf = t;
    } else if (buf.endsWith('-')) {
      buf = buf.slice(0, -1) + t; // 줄 끝 하이픈 붙이기
    } else {
      buf += ' ' + t;
    }
    prev = line;
  }
  if (buf) paras.push(buf);
  return paras.filter(hasLetter);
}

function makeParaEl(text, pending) {
  const p = document.createElement('p');
  p.className = pending ? 'bpara pending' : 'bpara';
  p.textContent = text;
  return p;
}

// 한 구역(EPUB 장 또는 PDF 쪽)의 문단을 차례로 번역해 채운다.
async function fillParagraphs(box, paragraphs, token) {
  box.innerHTML = '';
  if (paragraphs.length === 0) {
    box.appendChild(makeParaEl('(번역할 텍스트가 없습니다)', true));
    return;
  }
  const els = paragraphs.map((t) => { const el = makeParaEl(t, true); box.appendChild(el); return el; });
  for (let i = 0; i < paragraphs.length; i++) {
    const text = await translateText(paragraphs[i]);
    if (token !== state.browser.token) return; // 다른 장/파일로 넘어갔으면 중단
    els[i].textContent = text;
    els[i].classList.remove('pending');
  }
}

async function showBrowserChapter(index) {
  const view = state.views.trans;
  if (!view || view.kind !== 'browser' || !view.chapters) return;
  if (view.shown === index) return;
  view.shown = index;
  const token = ++state.browser.token;
  view.content.innerHTML = '';
  const doc = view.chapters[index];
  if (!doc) return;
  await fillParagraphs(view.content, epubParagraphs(doc), token);
}

// 칸 높이에 맞도록 글자 크기를 줄인다(서버 번역 PDF와 같은 방식). 최소 9px까지 줄이고,
// 그래도 넘치면 칸 안에서 스크롤한다.
function fitBox(box) {
  let size = 15;
  box.style.fontSize = `${size}px`;
  while (box.scrollHeight > box.clientHeight + 1 && size > 9) {
    size -= 0.5;
    box.style.fontSize = `${size}px`;
  }
}

async function fillBrowserPdfPage(view, index) {
  const box = view.content.querySelector(`[data-index="${index}"]`);
  if (!box || box.dataset.done) return;
  box.dataset.done = '1';
  const token = state.browser.token;
  try {
    const page = await view.pdf.getPage(index + 1);
    const paras = await pdfPageParagraphs(page);
    box.innerHTML = '';
    const label = document.createElement('div');
    label.className = 'pno';
    label.textContent = `${index + 1} / ${view.count}쪽`;
    box.appendChild(label);
    const inner = document.createElement('div');
    box.appendChild(inner);
    await fillParagraphs(inner, paras, token);
    fitBox(box);
  } catch (e) {
    box.textContent = `이 쪽을 번역할 수 없습니다: ${e.message}`;
    delete box.dataset.done;
  }
}

async function startBrowserView() {
  const srcLang = $('srcLang').value;
  await getTranslator(srcLang, $('tgtLang').value);

  dropView('trans');
  const content = $('paneTrans').querySelector('.content');
  content.innerHTML = '';
  state.transMode = 'browser';
  state.browser.token++;

  const src = await srcOf(state.item);
  if (state.item.format === 'txt') {
    // 텍스트: 빈 줄로 나뉜 문단을 차례로 번역한다
    const text = await textOf(src);
    const paras = text.split(/\n\s*\n/).map((s) => s.replace(/\s+/g, ' ').trim()).filter(hasLetter);
    const token = ++state.browser.token;
    state.views.trans = { kind: 'browser', content, count: 1, shown: 0 };
    await fillParagraphs(content, paras, token);
    setStatus('번역 (브라우저 내장)');
    return;
  }
  if (isEpub()) {
    if (!state.browser.epub || state.browser.epub.name !== state.item.name) {
      setStatus('EPUB 장 목록 읽는 중...');
      state.browser.epub = { name: state.item.name, chapters: await loadEpubChapters(src) };
    }
    const chapters = state.browser.epub.chapters;
    state.views.trans = { kind: 'browser', content, chapters, count: chapters.length, shown: -1 };
    showChapter(state.chapter);
    setStatus('번역 (브라우저 내장)');
    return;
  }

  const pdf = await pdfjsLib.getDocument(typeof src === 'string' ? src : { data: src.slice(0) }).promise;
  const view = { kind: 'browser', pdf, content, count: pdf.numPages, pdfPages: pdf.numPages };
  state.views.trans = view;
  // 쪽이 화면에 가까워질 때만 그 쪽을 번역한다.
  // 원본 쪽과 같은 배율·같은 여백·같은 높이로 칸을 만들어, 같은 쪽끼리 가로로 나란히 놓이게 한다.
  const width = Math.max(320, content.clientWidth - 32);
  const base = (await pdf.getPage(1)).getViewport({ scale: 1 });
  const scale = width / base.width;
  for (let i = 0; i < pdf.numPages; i++) {
    const vp = (await pdf.getPage(i + 1)).getViewport({ scale });
    const box = document.createElement('div');
    box.className = 'bpage';
    box.dataset.index = String(i);
    box.style.width = `${vp.width}px`;
    box.style.height = `${vp.height}px`; // 칸 높이를 고정해서 뒤 쪽이 밀리지 않게 한다
    box.style.maxWidth = 'none';
    box.textContent = `${i + 1} / ${pdf.numPages}쪽 번역 대기 중...`;
    content.appendChild(box);
  }
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) fillBrowserPdfPage(view, Number(e.target.dataset.index));
    }
  }, { root: content, rootMargin: '400px 0px' });
  content.querySelectorAll('.bpage').forEach((el) => io.observe(el));
  view.observer = io;
  setStatus('번역 (브라우저 내장)');
}

$('browserBtn').onclick = async () => {
  if (!state.item) return;
  $('browserBtn').disabled = true;
  setStatus('브라우저 번역 준비 중...');
  try {
    await startBrowserView();
    applyMode();
  } catch (e) {
    setStatus(`브라우저 번역 실패: ${e.message}`);
  } finally {
    $('browserBtn').disabled = false;
  }
};

// ---------------- 나란히 보기 스크롤 동기화 (PDF)

// 원본 창과 번역 창의 스크롤 비율을 맞춘다(PDF, EPUB, 브라우저 번역 모두 같은 방식).
// 길이가 다른 문서는 문장 위치가 정확히 맞지 않고 비율로만 맞는다.
function syncScroll(source) {
  if (state.syncing || state.mode !== 'side') return;
  const origC = $('paneOrig').querySelector('.content');
  const transC = $('paneTrans').querySelector('.content');
  const other = source === origC ? transC : origC;
  if (!other || other.childElementCount === 0) return;
  const range = source.scrollHeight - source.clientHeight;
  if (range <= 0) return;
  const ratio = source.scrollTop / range;
  state.syncing = true;
  other.scrollTop = ratio * (other.scrollHeight - other.clientHeight);
  requestAnimationFrame(() => { state.syncing = false; });
}

function attachScrollSync() {
  for (const id of ['paneOrig', 'paneTrans']) {
    const c = $(id).querySelector('.content');
    c.onscroll = () => syncScroll(c);
  }
}

// ---------------- 레이아웃

function applyMode() {
  document.querySelectorAll('#modes button').forEach((b) => {
    b.classList.toggle('on', b.dataset.mode === state.mode);
  });
  $('paneOrig').classList.toggle('hidden', state.mode === 'translated');
  $('paneTrans').classList.toggle('hidden', state.mode === 'original');
  $('panes').classList.toggle('single', state.mode !== 'side');
  attachScrollSync();
  requestAnimationFrame(() => {
    for (const v of Object.values(state.views)) {
      if (v.kind === 'epub') { try { v.rendition.resize(); } catch (_) {} }
    }
    showChapter(state.chapter);
  });
}

document.querySelectorAll('#modes button').forEach((b) => {
  b.onclick = () => { state.mode = b.dataset.mode; applyMode(); };
});
$('prev').onclick = () => showChapter(state.chapter - 1);
$('next').onclick = () => showChapter(state.chapter + 1);

// ---------------- 번역 실행

function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

$('translateBtn').onclick = async () => {
  if (!state.item) return;
  state.transMode = 'server';
  $('translateBtn').disabled = true;
  setStatus('번역 요청 중...');
  try {
    const { job_id } = await api('/local/translate', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name: state.item.name, target_lang: $('tgtLang').value }),
    });
    state.pollTimer = setInterval(() => pollJob(job_id), 2000);
    pollJob(job_id);
  } catch (e) {
    $('translateBtn').disabled = false;
    setStatus(`번역을 시작할 수 없습니다: ${e.message}`);
  }
};

async function pollJob(jobId) {
  try {
    const job = await api(`/jobs/${jobId}`);
    if (job.status === 'done') {
      stopPolling();
      let text = `번역 완료: ${job.translated}/${job.total} 문단, 원문 유지 ${job.failed}`;
      if (job.overflow) text += `, 칸을 넘친 문단 ${job.overflow}`;
      setStatus(text);
      $('translateBtn').disabled = false;
      state.item.translated = true;
      dropView('trans');
      state.transMode = 'server';
      await openTranslated();
      applyMode();
    } else if (job.status === 'failed') {
      stopPolling();
      $('translateBtn').disabled = false;
      setStatus(`번역 실패: ${job.error}`);
    } else {
      const total = job.progress ? job.progress.total : 0;
      const done = job.progress ? job.progress.done : 0;
      setStatus(total ? `번역 중 ${done}/${total} 문단` : '번역 준비 중...');
    }
  } catch (e) {
    stopPolling();
    $('translateBtn').disabled = false;
    setStatus(`상태를 확인할 수 없습니다: ${e.message}`);
  }
}

// 창 크기가 바뀌면 PDF 쪽 배율을 다시 맞추려고 다시 연다.
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!state.item || isEpub()) { applyMode(); return; }
    (async () => {
      const wasBrowser = state.transMode === 'browser';
      clearViews();
      await openOriginal();
      if (wasBrowser) {
        try { await startBrowserView(); } catch (e) { setStatus(`브라우저 번역 실패: ${e.message}`); }
      } else if (state.item.translated) {
        await openTranslated();
      }
      applyMode();
    })();
  }, 400);
});

// 파일 목록 접기/펴기
function toggleLibrary() {
  const collapsed = $('files').classList.toggle('hidden');
  if (state.serverMode) $('folderBox').classList.toggle('hidden', collapsed); // 웹 버전에는 폴더 칸이 없다
  document.querySelector('aside').classList.toggle('no-files', collapsed);
  $('libToggle').textContent = `${collapsed ? '▸' : '▾'} ${state.serverMode ? '라이브러리' : '열었던 파일'}`;
}
$('libToggle').onclick = toggleLibrary;

// 사이드바 전체를 접어 보기 영역을 넓힌다. 폭이 바뀌면 PDF 쪽 배율을 다시 맞추도록 resize를 알린다.
$('sideBtn').onclick = () => {
  document.querySelector('aside').classList.toggle('closed');
  window.dispatchEvent(new Event('resize'));
};
$('libToggle').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLibrary(); } };

// 라이브러리 폴더 변경 (로컬 또는 네트워크 경로). 바뀌면 화면을 새로 불러온다.
$('folderBtn').onclick = async () => {
  const path = $('folderInput').value.trim();
  if (!path) { setStatus('폴더 경로를 입력하세요.'); return; }
  try {
    await api('/local/folder', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ path }),
    });
    location.reload();
  } catch (e) {
    setStatus(`폴더를 바꿀 수 없습니다: ${e.message}`);
  }
};
$('folderInput').onkeydown = (e) => { if (e.key === 'Enter') $('folderBtn').click(); };

// 목차 접기/펴기
function toggleToc() {
  const collapsed = !document.querySelector('aside').classList.contains('toc-collapsed');
  document.querySelector('aside').classList.toggle('toc-collapsed', collapsed);
  $('tocToggle').textContent = `${collapsed ? '▸' : '▾'} 목차`;
}
$('tocToggle').onclick = toggleToc;
$('tocToggle').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleToc(); } };

// 목차 높이 조절 손잡이. 드래그한 높이는 브라우저에 저장해 다음에도 같은 크기로 연다.
(function setupSplitter() {
  const aside = document.querySelector('aside');
  const toc = $('tocBox');
  const splitter = $('splitter');
  const apply = (px) => aside.style.setProperty('--toc-h', `${px}px`);
  try {
    const saved = Number(localStorage.getItem('tocHeight'));
    if (saved > 0) apply(saved);
  } catch (_) {}

  splitter.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    const startY = e.clientY;
    const startH = toc.getBoundingClientRect().height;
    const move = (ev) => {
      // 목차는 최소 60px, 파일 목록은 최소 80px를 남긴다
      const max = aside.clientHeight - 80 - splitter.offsetHeight - $('folderBox').offsetHeight - 40;
      const h = Math.min(Math.max(60, startH + (ev.clientY - startY)), Math.max(60, max));
      apply(Math.round(h));
    };
    const up = () => {
      splitter.removeEventListener('pointermove', move);
      splitter.removeEventListener('pointerup', up);
      try { localStorage.setItem('tocHeight', String(Math.round(toc.getBoundingClientRect().height))); } catch (_) {}
    };
    splitter.addEventListener('pointermove', move);
    splitter.addEventListener('pointerup', up);
  });
})();

loadFiles();
</script>
